name: Build Morse for Windows

on:
  push:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Exercise the converter with simulated microphone returns
        run: npm run test:native
      - run: npm test
      - name: Package the x64 application and WASAPI helper
        run: npm run package:windows
      - name: Extract the ZIP and exercise the installed app across restarts
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/Morse-*-windows-x64.zip
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath build/extracted
          $env:MORSE_DESKTOP_EXECUTABLE = (Resolve-Path build/extracted/Morse.exe).Path
          npm run test:smoke
      - name: Keep the Windows test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Morse-windows-x64
          path: |
            desktop/dist/*-windows-x64.zip
            desktop/dist/SHA256SUMS-windows.txt
            desktop/dist/win32-build.json
            desktop/build/test-results/smoke.json
          if-no-files-found: error
